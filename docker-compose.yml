version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinical_ops_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinical_ops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clinical_ops_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: